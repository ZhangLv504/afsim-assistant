[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afsim-local-assistant"
version = "0.1.0"
description = "Local Ollama-based AFSIM scenario assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
afsim-assistant = "afsim_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

